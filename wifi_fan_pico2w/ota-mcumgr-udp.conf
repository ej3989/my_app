# Optional LAN-only OTA profile.
#
# This enables MCUboot image management through MCUmgr/SMP over UDP port 1337.
# Plain SMP/UDP has no client authentication or encryption. Do not expose this
# port through a router and do not use this profile on an untrusted network.

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
CONFIG_MCUMGR_TRANSPORT_UDP_PORT=1337
# Start SMP/UDP in main() after DHCP has assigned an IPv4 address.
CONFIG_MCUMGR_TRANSPORT_UDP_AUTOMATIC_INIT=n

