# Raspberry Pi Pico 2 W / CYW43439 Wi-Fi settings
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
# Supply the Raspberry Pi Pico 2 W CYW43439 NVRAM profile from this project.
# Without custom mode Zephyr selects the generic Murata 1YN module profile.
CONFIG_AIROC_WIFI_CUSTOM=y
# Request KR and let the Pico-specific CLM select its aggregate revision.
# WHD converts revision zero to -1 when it sends the country IOVAR.
CONFIG_WHD_WIFI_COUNTRY="0x0000524B"

# Send Zephyr logs through the SWD debug probe as well as UART0.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

